<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>验证码邮件</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
            text-align: center;
        }

        .code {
            text-align: center;
            margin: 30px 0;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #1890ff;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>您的验证码</h2>
    <p>尊敬的客户：</p>
    <p>您正在执行验证操作，您的验证码是：</p>
    <div class="code">#{verifyCode}</div>
    <p>该验证码有效期#{expireMinutes}分钟，请及时使用。</p>
    <p>如非本人操作，请忽略此邮件。</p>

    <div class="footer">
        <p>此邮件由系统自动发送，请勿直接回复。</p>
    </div>
</div>
</body>
</html>
